
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo App </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background:lightblue!important;
        }

        .todo-card {
            max-width: 650px;
            margin: 70px auto;
            padding: 35px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(30, 20, 80, 0.25);
        }

        .app-icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            color: white;
            font-size: 30px;
        }

        .subtitle {
            color: #777;
        }

        .task-input {
            min-height: 52px;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .task-input:focus {
            border-color: #8170e8;
            box-shadow: 0 0 0 0.2rem rgba(118, 75, 162, 0.15);
        }

        .add-btn {
            min-height: 52px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-weight: 600;
            transition: 0.2s;
        }

        .add-btn:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.3);
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
            padding: 16px;
            background: #f7f7ff;
            border: 1px solid #ecebff;
            border-radius: 14px;
            overflow-wrap: anywhere;
        }

        .task-number {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #e8e6ff;
            color: #6854ca;
            font-weight: 700;
        }

        .task-title {
            color: #333;
            font-weight: 500;
        }

        .empty-state {
            padding: 25px 10px;
            text-align: center;
            color: #888;
            background: #fafaff;
            border-radius: 14px;
        }

        .footer-text {
            color: #999;
            font-size: 12px;
        }

        @media (max-width: 576px) {
            .todo-card {
                margin: 25px 12px;
                padding: 24px 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div class="todo-card">

        <!-- Header -->
        <div class="text-center mb-4">
            <div class="app-icon">✓</div>
            <h1 class="fw-bold mb-2">My Todo App</h1>
            <p class="subtitle mb-0">
                Organize your day. One task at a time .
            </p>
        </div>

        <!-- Add Task Form -->
        <form action="/" method="post" class="mb-4">
            <label for="title" class="form-label fw-semibold">
                Add a new task
            </label>

            <div class="row g-2">
                <div class="col-12 col-sm-9">
                    <input
                            type="text"
                            id="title"
                            name="title"
                            class="form-control task-input"
                            placeholder="What do you need to do?"
                            required>
                </div>

                <div class="col-12 col-sm-3 d-grid">
                    <button type="submit" class="btn add-btn">
                        + Add Task
                    </button>
                </div>
            </div>
        </form>

        <!-- Task List -->

        <!-- Task List -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="section-title mb-0">Your Tasks</h2>
            <span class="badge rounded-pill text-bg-light border">
        <span th:text="${#lists.size(tasks)}">0</span> tasks
    </span>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(tasks)}" class="empty-state">
            <div class="fs-2 mb-2">📝</div>
            <h6 class="fw-bold">No tasks yet!</h6>
            <p class="mb-0 small">Add your first task to get started.</p>
        </div>

        <!-- Tasks -->
        <div th:each="task, status : ${tasks}" class="task-item">

            <!-- Task Number -->
            <span class="task-number"
                  th:text="${status.count}">1</span>

            <!-- Task Title -->
            <span class="task-title flex-grow-1"
                  th:text="${task.title}"
                  th:classappend="${task.completed} ? ' text-decoration-line-through text-secondary' : ''">
        Task title
    </span>

            <!-- Toggle Button -->
            <a th:href="@{/{id}/toggle(id=${task.id})}"
               class="btn btn-sm"
               th:classappend="${task.completed} ? ' btn-warning' : ' btn-success'"
               th:text="${task.completed} ? 'Undo' : 'Complete'">
                Complete
            </a>

            <!-- Delete Button -->
            <a th:href="@{/{id}/delete(id=${task.id})}"
               class="btn btn-sm btn-danger"
               onclick="return confirm('Are you sure you want to delete this task?');">
                Delete
            </a>

        </div>


        <!-- Footer -->
        <div class="text-center mt-4 pt-3 border-top">
            <p class="footer-text mb-0">
                Small steps every day lead to big results ✨
            </p>
        </div>

    </div>
</div>

</body>
</html>
